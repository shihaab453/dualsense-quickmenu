# Clean-environment Windows CI: locked dependencies, the hermetic test
# suite, a real PyInstaller build, and the packaged --selftest against both
# the build output and a copy extracted from the zip elsewhere - see
# tools/build.py, which is the one script this workflow runs and the same
# one a developer runs locally (`.venv\Scripts\python.exe tools\build.py`).
# Keeping that logic in one place means CI can't drift from what a local
# release build actually does.
#
# What this deliberately does NOT run: the `windows`-marked pytest suites
# (real global hotkey registration, real foreground-window switching) and
# the `hardware`-marked ones (need a physical DualSense). GitHub's hosted
# Windows runners don't reliably provide the interactive desktop session
# those need, and treating a best-effort pass/fail from a non-interactive
# runner as release evidence would be worse than being explicit that these
# are a separate, manual acceptance step - run
# `.venv\Scripts\python.exe -m pytest -m windows` (and, with a controller
# plugged in, `--hardware`) on a real desktop before calling a build a
# release. tools/build.py detects CI (the CI env var GitHub Actions sets)
# and narrows to `-m unit` for exactly this reason; see its module comment.
#
# This does not produce a *reproducible* build - see tools/build.py's module
# comment and the manifest's own "reproducibility_caveat" field for why not.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

# A new push to the same branch/PR supersedes the run already in flight for
# it - no point finishing a build for a commit that's no longer at the tip.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    # Backstop above tools/build.py's own 60s selftest timeout: this bounds
    # the whole job (checkout, dependency install, the full test suite, and
    # a real PyInstaller build), so a hang anywhere in that chain fails loudly
    # within half an hour instead of running until GitHub's own 6-hour cap.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the project's actual dev/release runtime (see version.py
          # and HANDOFF's Python-version note) - not the oldest version that
          # happens to work.
          python-version: '3.14'

      # Keyed on the lock file's own content, not requirements*.txt: the lock
      # file is what --require-hashes actually installs from, and its hash
      # changing is precisely the condition under which the cache should miss.
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ hashFiles('requirements-dev.lock.txt') }}

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock.txt

      - name: Build, verify, and package
        run: python tools\build.py

      # Uploaded unconditionally (always()), because a build that fails
      # partway still leaves test-evidence.xml behind, and that failure
      # record is exactly what someone debugging a red CI run needs - a run
      # that only uploads evidence for a successful build isn't evidence,
      # it's a trophy case.
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ github.sha }}
          path: |
            dist\*.zip
            dist\*.manifest.json
            dist\test-evidence.xml
            dist\smoke-test-record.json
          if-no-files-found: warn
          retention-days: 30

  # The same hermetic suites again, on Qt's offscreen platform plugin.
  #
  # Not redundant with the job above, which runs them on the runner's real
  # desktop session. The default font is a property of the platform plugin, so
  # anything measured with QFontMetrics - text elision, a size hint, a
  # fit-to-content height - can differ between the two, and an assertion that
  # depends on one of those passes on a desktop and fails headless (or the
  # reverse) on code that is behaving perfectly. That is exactly what happened
  # to verify_now_playing_card, which compared a label's text to a string the
  # card had already truncated: green on every desktop, three failures
  # offscreen, and nothing wrong with the card. See HANDOFF's Testing pattern
  # section.
  #
  # Deliberately does not run tools\build.py: a second PyInstaller build would
  # cost minutes to re-prove what the first job already proved. This job is
  # about the assertions, not the artifact, so it installs and runs pytest
  # directly. That is also why it is a separate job rather than another step -
  # it can fail while the build evidence above is still produced and uploaded.
  headless-tests:
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      # Qt renders into an offscreen surface instead of the desktop. No window
      # is ever mapped, which is the point.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ hashFiles('requirements-dev.lock.txt') }}

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock.txt

      # `unit` only, matching what tools\build.py narrows to under CI: the
      # windows- and hardware-marked suites need a real interactive session and
      # a plugged-in controller, so running them here would be worse than not
      # running them - see the note at the top of this file.
      - name: Run the hermetic suites headless
        run: python -m pytest -m unit -rs
