# One command to run the checks, and a way to run only some of them.
#
#   .venv\Scripts\python.exe -m pytest                     everything
#   .venv\Scripts\python.exe -m pytest -m unit             the hermetic ones
#   .venv\Scripts\python.exe -m pytest -m windows          the ones that touch real Windows state
#   .venv\Scripts\python.exe -m pytest --hardware          include the controller ones
#
# The suites themselves are still standalone scripts (tests\verify_*.py) that
# can be run on their own, which is the fastest way to work on one. pytest
# discovers and runs them through tests\test_suites.py; read the note at the
# top of that file before assuming they should be imported instead.

[pytest]
testpaths = tests

markers =
    unit: hermetic - no real OS state outside a temp folder, safe to run anywhere Windows and a display are available.
    windows: touches real Windows state (the registry, foreground focus, a global hotkey). Safe, but it will briefly take focus and it is not for a headless machine.
    hardware: needs a DualSense controller physically plugged in. Skipped unless --hardware is passed.

# Failures are what matter here, and every suite prints its own PASS/FAIL
# lines; -q keeps pytest's own noise from burying them.
addopts = -q
